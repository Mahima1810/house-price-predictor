<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <header class="header">
          <h1>House Price Predictor</h1>
          <p>Enter a few details to estimate a fair house price.</p>
        </header>

        <form id="predictForm" class="form">
          <label class="field">
            <span>Area (sq ft)</span>
            <input id="area" type="number" inputmode="decimal" min="1" step="1" placeholder="e.g., 1200" required />
          </label>

          <label class="field">
            <span>Rooms</span>
            <input id="rooms" type="number" inputmode="numeric" min="1" step="1" placeholder="e.g., 3" required />
          </label>

          <label class="field">
            <span>Location score (1–10)</span>
            <input id="location" type="number" inputmode="numeric" min="1" max="10" step="1" placeholder="e.g., 7" required />
          </label>

          <button id="predictBtn" type="submit" class="btn">
            <span class="btnText">Predict</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>

          <div id="message" class="message" role="status" aria-live="polite"></div>
        </form>

        <footer class="footer">
          <div class="result" id="result" aria-live="polite"></div>
        </footer>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
